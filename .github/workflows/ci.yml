name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    verify:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [20, 22, 24]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - run: npm ci

            - name: Format check
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Unit tests
              run: npm run test:coverage

            - name: Build
              run: npm run build

            - name: Exports sanity (publint + attw)
              run: npm run check

            - name: Bundle size budget
              run: npm run size

            - name: Tarball contents review
              run: npm run pack:verify
