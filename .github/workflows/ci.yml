name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    verify:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [20, 22, 24]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - run: npm ci

            - name: Format check
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Unit tests
              run: npm run test:coverage

            - name: Build
              run: npm run build

            - name: Exports sanity (publint + attw)
              run: npm run check

            - name: Bundle size budget
              if: matrix.node != '20'
              run: npm run size

            - name: Tarball contents review
              run: npm run pack:verify

    legacy-zod:
        name: zod 3
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - name: Install the oldest supported zod
              run: npm install --no-save --no-audit --no-fund zod@3.20.0

            - name: Typecheck
              run: npm run typecheck

            - name: Unit tests
              run: npm test
